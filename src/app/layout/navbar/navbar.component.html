<header class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <div class="brand-mark">
        @if (cafe.brand.logo) {
          <img [src]="cafe.brand.logo" [alt]="cafe.brand.name + ' logo'" />
        } @else {
          <span>
            {{ cafe.brand.shortName }}
          </span>
        }
      </div>

      <div class="brand-text">
        <strong>
          {{ cafe.brand.name }}
        </strong>

        <small>
          {{ cafe.brand.tagline }}
        </small>
      </div>
    </a>

    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="navigation" [class.open]="menuOpen">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Home
      </a>

      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"> About </a>

      <a routerLink="/menu" routerLinkActive="active" (click)="closeMenu()"> Menu </a>

      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"> Contact </a>

      <a routerLink="/menu" class="nav-cta" (click)="closeMenu()"> View Menu </a>
    </nav>
  </div>
</header>
